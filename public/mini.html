<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumoria · mini</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <main class="mini" id="mini" aria-label="Mini reproductor">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="clip" id="clip" hidden>
      <video id="video" muted playsinline preload="auto" aria-label="Videoclip (sin sonido: suena la canción)"></video>
      <p class="clip-note" id="clipNote" hidden>Esta canción no tiene videoclip disponible.</p>
    </div>
    <div class="top">
      <div class="art-wrap" id="artWrap" title="Doble clic: abrir Rumoria">
        <img class="art" id="art" alt="" draggable="false" hidden>
        <div class="art art-empty" id="artEmpty" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg>
        </div>
        <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="info">
        <div class="title-wrap"><div class="title" id="title">Nada sonando</div></div>
        <div class="artist" id="artist">Pon algo en Rumoria</div>
        <div class="lyric" id="lyric" aria-live="off"></div>
        <div class="lyric lyric-next" id="lyricNext" aria-hidden="true"></div>
        <div class="upnext" id="upnext"></div>
      </div>
      <div class="side">
        <button type="button" id="close" class="btn tiny" aria-label="Cerrar el mini reproductor" title="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
        <button type="button" id="main" class="btn tiny" aria-label="Abrir Rumoria" title="Abrir Rumoria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></svg>
        </button>
        <button type="button" id="pin" class="btn tiny" aria-label="Siempre encima" aria-pressed="true" title="Siempre encima">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 6 3 4H6l3-4Z" /></svg>
        </button>
        <button type="button" id="menu" class="btn tiny" aria-label="Opciones del mini reproductor" aria-expanded="false" title="Opciones">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><circle cx="5" cy="12" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="19" cy="12" r="1.8" /></svg>
        </button>
      </div>
    </div>
    <div class="bar-row">
      <span class="time" id="now">0:00</span>
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Posición" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="fill" id="fill"></div>
        <span class="tip" id="tip" hidden></span>
      </div>
      <span class="time" id="total">0:00</span>
    </div>
    <div class="controls">
      <button type="button" id="shuffle" class="btn small" aria-label="Aleatorio" aria-pressed="false" title="Aleatorio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" /></svg>
      </button>
      <button type="button" id="prev" class="btn" aria-label="Anterior" title="Anterior (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><path d="M19 5.6v12.8a.8.8 0 0 1-1.23.67L8.5 13V18a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v5l9.27-6.07A.8.8 0 0 1 19 5.6Z" /></svg>
      </button>
      <button type="button" id="play" class="btn main" aria-label="Reproducir" title="Reproducir / pausa (Espacio)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="solid" id="playIcon"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.9-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z" /></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="solid" id="pauseIcon" hidden><rect x="6" y="4.5" width="4" height="15" rx="1.2" /><rect x="14" y="4.5" width="4" height="15" rx="1.2" /></svg>
        <span class="spinner" id="spinner" hidden></span>
      </button>
      <button type="button" id="next" class="btn" aria-label="Siguiente" title="Siguiente (N)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="solid"><path d="M5 5.6v12.8a.8.8 0 0 0 1.23.67L15.5 13V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v5L6.23 4.93A.8.8 0 0 0 5 5.6Z" /></svg>
      </button>
      <button type="button" id="repeat" class="btn small" aria-label="Repetir: no" aria-pressed="false" title="Repetir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4" /><path d="M3 11v-1a4 4 0 0 1 4-4h14" /><path d="m7 22-4-4 4-4" /><path d="M21 13v1a4 4 0 0 1-4 4H3" /></svg>
        <span class="badge" id="repeatOne" hidden>1</span>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="like" class="btn small" aria-label="Añadir a Favoritas" aria-pressed="false" title="Favorita (L)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="heart"><path d="M19.5 12.6 12 20l-7.5-7.4A4.9 4.9 0 0 1 12 6a4.9 4.9 0 0 1 7.5 6.6Z" /></svg>
      </button>
      <button type="button" id="queueBtn" class="btn small" aria-label="A continuación" aria-expanded="false" title="A continuación (Q)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8M18 15v6M15 18h6" /></svg>
      </button>
      <button type="button" id="videoBtn" class="btn small" aria-label="Ver el videoclip" aria-pressed="false" title="Videoclip (V)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4" /></svg>
      </button>
      <button type="button" id="lyricsBtn" class="btn small" aria-label="Ver la letra" aria-pressed="false" title="Letra">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
      </button>
      <button type="button" id="mute" class="btn small" aria-label="Silenciar" aria-pressed="false" title="Silenciar (M) · rueda: volumen">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="volOn"><path d="M4 9v6h4l5 4V5L8 9Z" /><path d="M16 9.5a3.5 3.5 0 0 1 0 5" /><path d="M18.5 7a7 7 0 0 1 0 10" /></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" id="volOff" hidden><path d="M4 9v6h4l5 4V5L8 9Z" /><path d="m17 9 5 6M22 9l-5 6" /></svg>
      </button>
      <input type="range" id="volume" class="vol" min="0" max="1" step="0.05" aria-label="Volumen">
    </div>
    <div class="popover" id="queuePanel" role="dialog" aria-label="A continuación" hidden>
      <div class="pop-head">A continuación</div>
      <ol class="queue" id="queueList"></ol>
      <p class="pop-empty" id="queueEmpty">Nada más en la cola.</p>
    </div>
    <div class="menu" id="menuPanel" role="menu" hidden>
      <div class="menu-head">Forma</div>
      <label role="menuitemradio"><input type="radio" name="layout" value="normal" data-layout> Normal</label>
      <label role="menuitemradio"><input type="radio" name="layout" value="card" data-layout> Tarjeta (portada grande)</label>
      <label role="menuitemradio"><input type="radio" name="layout" value="compact" data-layout> Compacto (una línea)</label>
      <div class="menu-head">Qué enseña</div>
      <label role="menuitemcheckbox"><input type="checkbox" data-pref="showCover"> Portada</label>
      <label role="menuitemcheckbox"><input type="checkbox" data-pref="video"> Videoclip</label>
      <label role="menuitemcheckbox"><input type="checkbox" data-pref="lyrics"> Letra</label>
      <div class="menu-head">Ventana</div>
      <label role="menuitemcheckbox"><input type="checkbox" data-pref="onTop"> Siempre encima</label>
      <label role="menuitemcheckbox"><input type="checkbox" data-pref="locked"> Fijo (no se mueve)</label>
      <label role="menuitemcheckbox"><input type="checkbox" data-pref="hoverFull"> Opaco al pasar el ratón</label>
      <label class="range">Transparencia <input type="range" min="0.3" max="1" step="0.05" data-pref="opacity" aria-label="Opacidad"></label>
      <p class="menu-keys">Teclas: Espacio, ← →, ↑ ↓, N, P, L, M, V, Q. Rueda: volumen (sobre la barra: avanzar).</p>
    </div>
    <div class="flash" id="flash" role="status" hidden></div>
  </main>
  <script src="mini.js"></script>
</body>
</html>
